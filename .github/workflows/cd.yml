name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Trusted publishing (OIDC) requires npm 11.5.1+ / Node 22.14+;
          # Node 22.x has a known E404-on-publish bug with OIDC exchange —
          # Node 24 is the documented working combination.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Set version from tag
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
      - name: Publish to npm
        # Trusted publishing (OIDC): GitHub Actions authenticates to npm
        # directly via the id-token permission — no NPM_TOKEN secret needed.
        # Requires the @xirothedev scope to have trusted publishing enabled
        # (npm web UI: Settings -> Trusted Publishing, OIDC provider
        # https://token.actions.githubusercontent.com, repo
        # xirothedev/opencode-office-plugin).
        run: npm publish --provenance --access public --no-git-checks
