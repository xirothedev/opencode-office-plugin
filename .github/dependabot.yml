# Dependabot — org baseline (rules/dependabot.md) + 7-day version cooldown.
# Cooldown is native (GA 2025-07): Dependabot opens a version-update PR only
# when the new version is at least default-days old. Security updates bypass
# cooldown by design.
version: 2
updates:
  # package.json + bun.lock (npm ecosystem covers bun)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: [dependencies, automated]
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope
    open-pull-requests-limit: 5
    # Host-coupled pins: current opencode2 hosts reject plugin-tool input decode
    # in every effect/schema era (docs/reports/2026-09-03-opencode-beta-interop.md).
    # A bump here is only meaningful paired with a host whose decode reads the
    # matching AST — gate on the probe_simple test from the report.
    ignore:
      - dependency-name: effect
      - dependency-name: "@opencode-ai/schema"

  # tests/isolated-workspace (opencode2 CLI pin for the Isolated Runtime)
  - package-ecosystem: bun
    directory: /tests/isolated-workspace
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: [dependencies, automated]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    # The Plugin Harness couples the host binary to the plugin API pins above;
    # host bumps are a deliberate, tested event, not a routine bump.
    ignore:
      - dependency-name: "@opencode-ai/cli"

  # action refs in .github/workflows (SHA-pinned; Dependabot syncs the SHA + comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: [dependencies, automated]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  # NOTE: the packageManager field (bun binary) has no dependabot ecosystem on this
  # instance (package-manager-versions is not accepted by the config schema).
  # Bump bun@1.3.14 by hand; run `git grep <old-version>` to catch the workflows.

  # No docker ecosystem: no Dockerfile exists; an empty "*" glob hard-fails the
  # update job. Add a docker entry (concrete directory) when a Dockerfile lands.
  # No entry for .opencode/package.json either — dependabot's fetch skips it
  # (tracked but gitignored), the job dies on "package.json not found".
